# Audio Hardware Package
# Contains: i2s_audio, audio_adc, audio_dac, microphone, speaker, media_player

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:
      number: $i2s_bclk
      allow_other_uses: true
    i2s_mclk_pin:
      number: $i2s_mclk

  - id: i2s_input
    i2s_lrclk_pin:
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:
      number: $i2s_bclk
      allow_other_uses: true

audio_adc:
  - platform: es7210
    id: adc_mic
    i2c_id: internal_i2c
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_mic

external_components:
  # All components from patched fork - fixes voice_assistant for ESPHome 2026.4.0
  - source:
      type: git
      url: "https://github.com/f17mkx/waveshare-s2-audio_esphome_voice"
      ref: rework-branch
    components: [ es8311, esp_afe, voice_assistant ]
    refresh: 0s

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    use_mclk: true
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_spk
    force_master: true
    mclk_multiple: $i2s_mclk_multiple

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    i2s_audio_id: i2s_input
    i2s_mode: $i2s_mode_mic
    sample_rate: 16000
    bits_per_sample: $i2s_bps_mic
    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    channel: stereo  # Dual mic for AFE beamforming

  # AFE-processed microphone - uses lazy initialization to avoid RAM conflicts
  - platform: esp_afe
    id: afe_processed_mic
    esp_afe_id: audio_frontend

# ESP-SR Audio Front End with LAZY INITIALIZATION
# Dual mic with BSS (Blind Source Separation) for beamforming
esp_afe:
  id: audio_frontend
  microphone_source: i2s_mics
  # speaker_reference removed - not using AEC
  afe_mode: LOW_COST
  aec_enabled: false  # Disable AEC to remove reference channel requirement
  bss_enabled: false  # Disabled - BSS adds latency for beamforming
  ns_enabled: true    # Enable noise suppression (lighter than BSS)
  vad_enabled: false
  agc_enabled: true   # Auto gain control for consistent levels

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO16
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    dac_type: external
    timeout: never
    buffer_duration: 100ms
    audio_dac: es8311_dac
    sample_rate: $i2s_sample_rate
    bits_per_sample: 16bit
    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    channel: stereo

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: "Speaker"
    internal: False
    volume_increment: 0.1
    volume_min: 0.0
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_mute:
      - delay: 100ms
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms
      - script.execute: control_leds_volume_changed
    on_volume:
      - logger.log:
          format: "[VOLUME] on_volume triggered, volume=%.2f, init=%d"
          args: ['id(external_media_player).volume', 'id(init_in_progress)']
      - if:
          condition:
            - lambda: return !id(init_in_progress);
          then:
            - lambda: |-
                id(current_volume) = id(external_media_player).volume;
                ESP_LOGI("volume", "current_volume set to %.2f", id(current_volume));
            - script.execute: show_volume_gradient
    files:
      - id: mute_switch_on_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
      - id: mute_switch_off_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/RADargar/waveshare-s2-audio_esphome_voice/raw/refs/heads/Personal-settings/audio/listening.flac
      - id: white_noise
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3
