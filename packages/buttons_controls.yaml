# Buttons and Controls Package
# Contains: binary_sensors (buttons), number (gains), select (button actions), event

globals:
  - id: mic_gain_saved
    type: float
    restore_value: yes
    initial_value: '32.0'
  - id: mic_is_muted
    type: bool
    restore_value: yes
    initial_value: 'false'

number:
  - platform: template
    id: mic_gain_db
    name: "Microphone Gain"
    icon: mdi:microphone-settings
    entity_category: config
    min_value: 0
    max_value: 36
    step: 3
    restore_value: true
    initial_value: 32
    set_action:
      - lambda: |-
          id(adc_mic).set_mic_gain(x);
      - logger.log:
          format: "[MIC] Set ES7210 gain to %.0f dB"
          args: ["x"]

  - platform: template
    id: mic_gain_factor
    name: "Voice Boost"
    icon: mdi:amplifier
    entity_category: config
    min_value: 1
    max_value: 64
    step: 1
    restore_value: true
    initial_value: 32
    set_action:
      - lambda: |-
          id(va_mic).set_gain_factor(x);
      - logger.log:
          format: "[MIC] Set gain factor to %.0f"
          args: ["x"]

  - platform: template
    id: noise_suppression
    name: "Noise Reduction"
    icon: mdi:waveform
    entity_category: config
    min_value: 0
    max_value: 4
    step: 1
    restore_value: true
    initial_value: 4
    set_action:
      - lambda: |-
          id(va).set_noise_suppression_level(x);
      - logger.log:
          format: "[MIC] Set suppression to %.0f"
          args: ["x"]

switch:
  - platform: gpio
    id: amp_enable_8
    name: Amplifier
    icon: mdi:speaker
    entity_category: config
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(mic_is_muted);
    turn_on_action:
      - lambda: |-
          id(mic_is_muted) = true;
          id(adc_mic).set_mic_gain(0.0f);
      - script.execute: flash_ring
    turn_off_action:
      - lambda: |-
          id(mic_is_muted) = false;
          id(adc_mic).set_mic_gain(id(mic_gain_saved));
      - script.execute: flash_ring

  - platform: template
    id: voice_assistant_enabled
    name: "Voice Assistant"
    icon: mdi:microphone
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - logger.log: "Voice Assistant ENABLED"
      - micro_wake_word.start:
    turn_off_action:
      - logger.log: "Voice Assistant DISABLED"
      - micro_wake_word.stop:
      - voice_assistant.stop:

  - platform: template
    id: mute_sound
    name: "Feedback Sounds"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_sound
    name: "Wake Sound Effect"
    icon: mdi:bullhorn
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

