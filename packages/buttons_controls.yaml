event:
  - platform: template
    id: button_press_event
    name: "Button Press"
    icon: mdi:gesture-tap-button
    device_class: button
    event_types:
      - key1_single
      - key1_double
      - key1_long
      - key2_single
      - key2_double
      - key2_long
      - key3_single
      - key3_double
      - key3_long

script:
  # Centralized button action handler
  - id: execute_button_action
    parameters:
      action_name: string
      button_id: string
    then:
      - lambda: |-
          ESP_LOGI("button", "Action '%s' for '%s'", action_name.c_str(), button_id.c_str());
          if (action_name == "None") {
            return;
          } else if (action_name == "Volume Up") {
            id(external_media_player).make_call().set_command(
              media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_VOLUME_UP).perform();
          } else if (action_name == "Volume Down") {
            id(external_media_player).make_call().set_command(
              media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_VOLUME_DOWN).perform();
          } else if (action_name == "Mute Toggle") {
            id(external_media_player).make_call().set_command(
              media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_MUTE).perform();
          } else if (action_name == "Play/Pause") {
            id(external_media_player).make_call().set_command(
              media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_TOGGLE).perform();
          } else if (action_name == "Next Track" || action_name == "Previous Track") {
            // Not supported by ESPHome media_player - use HA event instead
            ESP_LOGW("button", "Next/Previous Track not supported - sending HA event");
          } else if (action_name == "Toggle Voice Assistant") {
            id(voice_assistant_enabled).toggle();
          }
      - if:
          condition:
            lambda: 'return action_name == "Start Voice Assistant";'
          then:
            - voice_assistant.start:
      - if:
          condition:
            lambda: 'return action_name == "Send HA Event" || action_name == "Next Track" || action_name == "Previous Track";'
          then:
            - homeassistant.event:
                event: esphome.button_action
                data:
                  button: !lambda 'return button_id;'
                  action: !lambda 'return action_name;'

binary_sensor:
  - platform: gpio
    name: "Button: Volume Down"
    id: key1_button
    icon: mdi:volume-minus
    entity_category: diagnostic
    pin:
      tca9555: ioexp
      number: 9
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_multi_click:
      # Single Press
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - script.execute:
                    id: execute_button_action
                    action_name: !lambda 'return id(key1_single_action).current_option();'
                    button_id: "key1"
          - event.trigger:
              id: button_press_event
              event_type: "key1_single"
      # Double Press
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - script.execute:
              id: execute_button_action
              action_name: !lambda 'return id(key1_double_action).current_option();'
              button_id: "key1"
          - event.trigger:
              id: button_press_event
              event_type: "key1_double"
      # Long Press
      - timing:
          - ON for at least 1s
        then:
          - script.execute:
              id: execute_button_action
              action_name: !lambda 'return id(key1_long_action).current_option();'
              button_id: "key1"
          - event.trigger:
              id: button_press_event
              event_type: "key1_long"

  - platform: gpio
    name: "Button: Play/Pause"
